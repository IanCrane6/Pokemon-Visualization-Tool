# YOLOv8n + CBAM + P2 head (pokemon_snap full modification stack without SIoU).
#
# Combines yolov8n_p2.yaml with CBAMExt after the final backbone C2f (stride-32),
# matching the insertion point used in yolov8n_cbam.yaml.

nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0
  - [-1, 1, Conv, [128, 3, 2]]          # 1
  - [-1, 3, C2f, [128, True]]           # 2    <- P2 source
  - [-1, 1, Conv, [256, 3, 2]]          # 3
  - [-1, 6, C2f, [256, True]]           # 4    <- P3 source
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 6, C2f, [512, True]]           # 6    <- P4 source
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 3, C2f, [1024, True]]          # 8
  - [-1, 1, CBAM, [256]]            # 9    <- CBAM attention
  - [-1, 1, SPPF, [1024, 5]]            # 10   <- P5 source

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]           # 12
  - [-1, 3, C2f, [512]]                 # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]           # 15
  - [-1, 3, C2f, [256]]                 # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]           # 18
  - [-1, 3, C2f, [128]]                 # 19 (P2)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]          # 21
  - [-1, 3, C2f, [256]]                 # 22 (P3)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]          # 24
  - [-1, 3, C2f, [512]]                 # 25 (P4)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]          # 27 cat SPPF
  - [-1, 3, C2f, [1024]]                # 28 (P5)

  - [[19, 22, 25, 28], 1, Detect, [nc]]
