# YOLOv8n + P2 small-object detection head.
#
# Mirrors upstream ultralytics/cfg/models/v8/yolov8-p2.yaml (scale 'n').
# Adds a 4th detection head at stride=4 (P2/4), which substantially improves
# recall on very small targets (<16 px). Justification for Pokemon Snap:
# in-game screenshots frequently contain distant/small Pokemon (Magikarp at
# sea, Pidgey against sky) that the stock P3/P4/P5 heads under-cover.

nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 3, C2f, [128, True]]           # 2         <- used by P2 head
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 6, C2f, [256, True]]           # 4         <- used by P3 head
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 6, C2f, [512, True]]           # 6         <- used by P4 head
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 3, C2f, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9         <- used by P5 head

head:
  # Top-down path: P5 -> P4 -> P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]           # 11  cat P4
  - [-1, 3, C2f, [512]]                 # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]           # 14  cat P3
  - [-1, 3, C2f, [256]]                 # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]           # 17  cat P2
  - [-1, 3, C2f, [128]]                 # 18 (P2/4-xsmall)

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]          # 20
  - [-1, 3, C2f, [256]]                 # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]          # 23
  - [-1, 3, C2f, [512]]                 # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]           # 26
  - [-1, 3, C2f, [1024]]                # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
