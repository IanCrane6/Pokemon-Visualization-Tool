# E0 — vanilla YOLOv8n on `all` (63 classes). Baseline reference.
# Already trained at runs/yolo/yolo_all_v8n/; this file exists for
# reproducibility and to let the runner skip it via --skip-existing.
experiment_name: e0_baseline_all
seed: 42

data:
  dataset_name: all_levels_all_sources_v1
  levels: [all]
  sources: [PokemonAPI, HuggingFace]
  raw_dir: data/raw
  processed_dir: data/processed
  auto_prepare: true
  download: true
  force_rebuild: false
  overwrite_yolo_export: false
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

model:
  name: yolov8n.pt

train:
  image_size: 320
  epochs: 20
  batch_size: 32
  workers: 8
  device: "0"
  loss_iou_type: ciou

output:
  root_dir: runs/yolo_ablation
