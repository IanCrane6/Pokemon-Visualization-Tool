experiment_name: cls_syn_v2_dinov3
seed: 42

data:
  manifest_path: data/manifest.csv
  label_map_path: data/label_to_id.json

model:
  name: vit_base_patch16_dinov3.lvd1689m
  pretrained: true

train:
  image_size: 256
  batch_size: 64
  num_workers: 8
  epochs: 15
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  device: cuda
  amp: true
  selection_metric: accuracy

output:
  root_dir: runs
