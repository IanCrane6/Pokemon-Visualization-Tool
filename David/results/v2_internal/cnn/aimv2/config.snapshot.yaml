experiment_name: cls_syn_v2_aimv2
seed: 42

data:
  manifest_path: data/manifest.csv
  label_map_path: data/label_to_id.json

model:
  name: aimv2_large_patch14_224.apple_pt
  pretrained: true

train:
  image_size: 224
  batch_size: 32
  num_workers: 8
  epochs: 15
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  device: cuda
  amp: true
  selection_metric: accuracy

output:
  root_dir: runs
